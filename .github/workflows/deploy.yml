name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Reconstruction quotidienne (7 h, heure de Paris en été) : actualise le fil de veille.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# Moindre privilège : lecture du dépôt, écriture Pages uniquement.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construction du site
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configuration de GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification et construction (astro check + astro build)
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Archive créée ici plutôt qu'avec actions/upload-pages-artifact, qui exclut
      # les dossiers cachés : /.well-known/security.txt doit être publié (RFC 9116).
      - name: Archivage du site
        run: tar --dereference --hard-dereference --directory dist -cvf "$RUNNER_TEMP/artifact.tar" .

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
