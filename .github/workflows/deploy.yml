name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : lecture du dépôt, écriture Pages uniquement.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Astro + Pagefind)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Installation de Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Configuration de GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Installation des dépendances
        run: npm ci

      - name: Build (vérification TypeScript, Astro, index Pagefind)
        run: npm run build
        env:
          # URL et chemin de base réels fournis par GitHub Pages
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Publication de l'artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
