<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" font-family="Segoe UI, system-ui, Arial, sans-serif" role="img" aria-label="Plusieurs machines Ubuntu de test se connectent avec des comptes utilisateurs différents pour créer des tickets à l'interface web de GLPI, installé sur une machine Ubuntu avec un serveur web, PHP et une base de données">
  <rect width="820" height="310" fill="#ffffff"/>

  <!-- Cadre -->
  <rect x="15" y="15" width="790" height="280" rx="12" fill="#f8fafc" stroke="#1e3a70" stroke-width="1.5"/>
  <text x="35" y="41" font-size="14" font-weight="600" fill="#0f172a">Environnement de test</text>

  <!-- Postes de test -->
  <g text-anchor="middle">
    <rect x="35" y="58" width="215" height="62" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="142" y="84" font-size="14" font-weight="600" fill="#0f172a">Ubuntu — poste de test</text>
    <text x="142" y="104" font-size="12.5" fill="#475569">utilisateur — crée un ticket</text>

    <rect x="35" y="134" width="215" height="62" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="142" y="160" font-size="14" font-weight="600" fill="#0f172a">Ubuntu — poste de test</text>
    <text x="142" y="180" font-size="12.5" fill="#475569">utilisateur — crée un ticket</text>

    <rect x="35" y="210" width="215" height="62" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="142" y="236" font-size="14" font-weight="600" fill="#0f172a">Ubuntu — poste de test</text>
    <text x="142" y="256" font-size="12.5" fill="#475569">utilisateur — crée un ticket</text>
  </g>

  <!-- Liaisons -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M250 89 H295 V165"/>
    <path d="M250 241 H295 V165"/>
    <path d="M250 165 H345"/>
  </g>
  <path d="M345 165 l-9 -5 v10 z" fill="#64748b"/>
  <text x="320" y="154" font-size="11.5" text-anchor="middle" fill="#475569">tickets</text>

  <!-- Serveur GLPI -->
  <rect x="345" y="58" width="440" height="214" rx="10" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
  <text x="365" y="84" font-size="14" font-weight="600" fill="#0f172a">Ubuntu — serveur GLPI</text>

  <g text-anchor="middle">
    <rect x="365" y="100" width="400" height="62" rx="8" fill="#1e3a70"/>
    <text x="565" y="126" font-size="14" font-weight="600" fill="#ffffff">GLPI</text>
    <text x="565" y="146" font-size="12" fill="#ffffff">l'administrateur reçoit les tickets et y répond</text>

    <rect x="365" y="176" width="193" height="78" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="461" y="210" font-size="14" font-weight="600" fill="#0f172a">Serveur web + PHP</text>
    <text x="461" y="230" font-size="12" fill="#475569">exécute l'application</text>

    <rect x="572" y="176" width="193" height="78" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="668" y="210" font-size="14" font-weight="600" fill="#0f172a">Base de données</text>
    <text x="668" y="230" font-size="12" fill="#475569">parc, tickets, comptes</text>
  </g>
</svg>
