<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Segoe UI, system-ui, Arial, sans-serif" role="img" aria-label="Router-on-a-stick : un routeur relié par un lien trunk 802.1Q à un commutateur qui dessert le VLAN administratif et le VLAN technique">
  <rect width="820" height="340" fill="#ffffff"/>
  <g text-anchor="middle">
    <!-- Routeur -->
    <rect x="300" y="15" width="220" height="70" rx="8" fill="#eef3fa" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="410" y="42" font-size="14" font-weight="600" fill="#0f172a">Routeur</text>
    <text x="410" y="62" font-size="12.5" fill="#475569">une sous-interface par VLAN</text>
    <text x="410" y="78" font-size="12.5" fill="#475569">+ étendues DHCP</text>

    <!-- Trunk -->
    <line x1="410" y1="85" x2="410" y2="145" stroke="#1e3a70" stroke-width="4"/>
    <text x="425" y="120" font-size="13" text-anchor="start" fill="#1e3a70" font-weight="600">trunk 802.1Q (VLAN 10 + 20)</text>

    <!-- Commutateur -->
    <rect x="320" y="145" width="180" height="52" rx="8" fill="#eef3fa" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="410" y="176" font-size="14" font-weight="600" fill="#0f172a">Commutateur</text>

    <line x1="360" y1="197" x2="220" y2="245" stroke="#64748b" stroke-width="2"/>
    <line x1="460" y1="197" x2="600" y2="245" stroke="#64748b" stroke-width="2"/>

    <!-- VLAN 10 -->
    <rect x="70" y="245" width="300" height="75" rx="10" fill="#f8fafc" stroke="#2a4f8f" stroke-width="1.5"/>
    <text x="220" y="274" font-size="14" font-weight="600" fill="#1e3a70">VLAN 10 — Administratif</text>
    <text x="220" y="298" font-size="12.5" fill="#475569">postes des services administratifs</text>

    <!-- VLAN 20 -->
    <rect x="450" y="245" width="300" height="75" rx="10" fill="#f8fafc" stroke="#2a4f8f" stroke-width="1.5"/>
    <text x="600" y="274" font-size="14" font-weight="600" fill="#1e3a70">VLAN 20 — Technique</text>
    <text x="600" y="298" font-size="12.5" fill="#475569">postes du service technique</text>
  </g>
</svg>
