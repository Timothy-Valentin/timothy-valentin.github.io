<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Segoe UI, system-ui, Arial, sans-serif" role="img" aria-label="Sous Proxmox VE, une machine cliente Ubuntu envoie ses journaux en Syslog UDP 1514 vers le serveur de centralisation, qui exécute Graylog, OpenSearch et MongoDB 4.4 dans des conteneurs Docker">
  <rect width="820" height="330" fill="#ffffff"/>

  <!-- Hyperviseur -->
  <rect x="15" y="15" width="790" height="300" rx="12" fill="#f8fafc" stroke="#1e3a70" stroke-width="1.5"/>
  <text x="35" y="41" font-size="14" font-weight="600" fill="#0f172a">Proxmox VE</text>

  <!-- Client -->
  <rect x="35" y="125" width="185" height="100" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
  <text x="127" y="160" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">VM Ubuntu — client</text>
  <text x="127" y="182" font-size="12.5" text-anchor="middle" fill="#475569">Rsyslog</text>
  <text x="127" y="201" font-size="12.5" text-anchor="middle" fill="#475569">format RFC 5424</text>

  <line x1="220" y1="175" x2="300" y2="175" stroke="#64748b" stroke-width="2"/>
  <path d="M300 175 l-9 -5 v10 z" fill="#64748b"/>
  <text x="259" y="164" font-size="11.5" text-anchor="middle" fill="#475569">Syslog UDP</text>
  <text x="259" y="194" font-size="11.5" text-anchor="middle" fill="#475569">port 1514</text>

  <!-- Serveur de centralisation -->
  <rect x="300" y="52" width="485" height="246" rx="10" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
  <text x="320" y="78" font-size="14" font-weight="600" fill="#0f172a">VM Ubuntu Server — serveur de centralisation</text>

  <rect x="320" y="92" width="445" height="34" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <text x="542" y="114" font-size="12.5" text-anchor="middle" fill="#475569">Rsyslog local — les journaux du serveur sont aussi transférés</text>

  <!-- Docker Compose -->
  <rect x="320" y="140" width="445" height="144" rx="8" fill="#f8fafc" stroke="#1e3a70" stroke-width="1.5"/>
  <text x="335" y="162" font-size="12.5" font-weight="600" fill="#0f172a">Docker Compose</text>

  <g text-anchor="middle">
    <rect x="335" y="174" width="132" height="96" rx="8" fill="#1e3a70"/>
    <text x="401" y="212" font-size="14" font-weight="600" fill="#ffffff">Graylog</text>
    <text x="401" y="232" font-size="12" fill="#ffffff">collecte et interface</text>
    <text x="401" y="250" font-size="12" fill="#ffffff">streams, extracteurs</text>

    <rect x="477" y="174" width="132" height="96" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="543" y="212" font-size="14" font-weight="600" fill="#0f172a">OpenSearch</text>
    <text x="543" y="232" font-size="12" fill="#475569">stockage et recherche</text>
    <text x="543" y="250" font-size="12" fill="#475569">index des messages</text>

    <rect x="619" y="174" width="132" height="96" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="685" y="212" font-size="14" font-weight="600" fill="#0f172a">MongoDB 4.4</text>
    <text x="685" y="232" font-size="12" fill="#475569">configuration</text>
    <text x="685" y="250" font-size="12" fill="#475569">et métadonnées</text>
  </g>
</svg>
