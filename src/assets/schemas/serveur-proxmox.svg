<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" font-family="Segoe UI, system-ui, Arial, sans-serif" role="img" aria-label="Poste d'administration relié au serveur physique reconditionné qui exécute Proxmox VE et héberge des machines virtuelles Debian, Ubuntu et Kali Linux">
  <rect width="820" height="290" fill="#ffffff"/>
  <!-- Poste d'administration -->
  <rect x="15" y="105" width="180" height="76" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
  <text x="105" y="136" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">Poste d'administration</text>
  <text x="105" y="158" font-size="12.5" text-anchor="middle" fill="#475569">navigateur web · PuTTY</text>

  <line x1="195" y1="143" x2="262" y2="143" stroke="#64748b" stroke-width="2"/>
  <text x="228" y="132" font-size="11.5" text-anchor="middle" fill="#475569">HTTPS · SSH</text>

  <!-- Serveur physique -->
  <rect x="262" y="15" width="543" height="260" rx="12" fill="#f8fafc" stroke="#1e3a70" stroke-width="1.5"/>
  <text x="282" y="42" font-size="14" font-weight="600" fill="#0f172a">Serveur physique reconditionné</text>
  <text x="282" y="62" font-size="12.5" fill="#475569">matériel issu du Ministère de la Justice, hébergé au lycée</text>

  <!-- Proxmox -->
  <rect x="282" y="80" width="503" height="44" rx="8" fill="#1e3a70"/>
  <text x="533" y="108" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Proxmox VE — hyperviseur de type 1</text>

  <!-- VMs -->
  <g text-anchor="middle">
    <rect x="282" y="145" width="155" height="110" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="359" y="195" font-size="14" font-weight="600" fill="#0f172a">VM Debian</text>
    <text x="359" y="215" font-size="12.5" fill="#475569">administration Linux</text>

    <rect x="456" y="145" width="155" height="110" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="533" y="195" font-size="14" font-weight="600" fill="#0f172a">VM Ubuntu</text>
    <text x="533" y="215" font-size="12.5" fill="#475569">services, clients</text>

    <rect x="630" y="145" width="155" height="110" rx="8" fill="#ffffff" stroke="#1e3a70" stroke-width="1.5"/>
    <text x="707" y="195" font-size="14" font-weight="600" fill="#0f172a">VM Kali Linux</text>
    <text x="707" y="215" font-size="12.5" fill="#475569">environnement de test</text>
  </g>
</svg>
